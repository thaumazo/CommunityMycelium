{% if form.visible_to_commons %}
  <div class="mt-6">
    <label class="block text-sm font-medium text-gray-700 mb-2">{{ form.visible_to_commons.label }}</label>
    <p class="text-xs text-gray-500 mb-2">{{ form.visible_to_commons.help_text }}</p>
    <div class="space-y-2 max-h-64 overflow-y-auto border border-gray-200 rounded-md p-3">
      {% for choice in form.visible_to_commons %}
        <div class="flex items-center">
          <input type="checkbox" name="{{ choice.data.name }}" value="{{ choice.data.value }}" id="{{ choice.id_for_label }}" {{ choice.data.selected|yesno:'checked,' }} class="h-4 w-4 text-indigo-600 border-gray-300 rounded focus:ring-indigo-500" />
          <label for="{{ choice.id_for_label }}" class="ml-2 block text-sm text-gray-900">{{ choice.choice_label }}</label>
        </div>
      {% empty %}
        <p class="text-sm text-gray-400">You're not a member of any commons yet.</p>
      {% endfor %}
    </div>
    {% if form.visible_to_commons.errors %}
      <div class="mt-1 text-sm text-red-600">{{ form.visible_to_commons.errors|join:', ' }}</div>
    {% endif %}
  </div>
{% endif %}
