<div class="mt-8 flex flex-wrap items-center gap-3 border-t border-gray-200 pt-5">
  <button type="submit" name="action_save" value="{{ section }}" class="rounded-md bg-indigo-600 px-4 py-2 text-sm font-semibold text-white hover:bg-indigo-500">Save {{ label }}</button>
  <button type="submit" name="action_skip" value="{{ section }}" class="rounded-md border border-gray-300 bg-white px-4 py-2 text-sm font-semibold text-gray-700 hover:bg-gray-50">Skip for now</button>
  {% if section in skipped_sections %}<span class="text-sm text-gray-500">This section is marked skipped. Saving it will bring it back into your orientation.</span>{% endif %}
</div>
