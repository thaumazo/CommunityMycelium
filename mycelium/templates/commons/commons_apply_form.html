{% extends 'base.html' %}

{% block content %}
  <div class="max-w-7xl mx-auto py-6 sm:px-6 lg:px-8">
    <div class="px-4 py-6 sm:px-0">
      <div class="max-w-3xl mx-auto">
        <div class="bg-white shadow sm:rounded-lg">
          <div class="px-4 py-5 sm:p-6">
            <h1 class="text-2xl font-semibold text-gray-900 mb-2">Apply to Join {{ commons.title }}</h1>
            <p class="text-sm text-gray-500 mb-6">A commons owner or admin will review your application.</p>

            <form method="post" class="space-y-6">
              {% csrf_token %}
              <div>
                <label for="{{ form.note.id_for_label }}" class="block text-sm font-medium text-gray-700">{{ form.note.label }}</label>
                <div class="mt-1">
                  <textarea name="{{ form.note.html_name }}" id="{{ form.note.id_for_label }}" rows="3" class="w-full">{{ form.note.value|default:'' }}</textarea>
                </div>
                {% if form.note.help_text %}<p class="mt-1 text-sm text-gray-500">{{ form.note.help_text }}</p>{% endif %}
              </div>

              <div class="flex justify-end space-x-3">
                <a href="{% url 'commons_detail' commons.pk %}" class="bg-white py-2 px-4 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 hover:bg-gray-50">Cancel</a>
                <button type="submit" class="bg-indigo-600 border border-transparent rounded-md shadow-sm py-2 px-4 text-sm font-medium text-white hover:bg-indigo-700">Submit Application</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
