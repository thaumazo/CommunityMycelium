{% extends 'base.html' %}

{% block content %}
  <div class="max-w-2xl mx-auto py-6 sm:px-6 lg:px-8">
    <div class="px-4 py-6 sm:px-0">
      <div class="bg-white shadow sm:rounded-lg">
        <div class="px-4 py-5 sm:p-6">
          <h1 class="text-2xl font-semibold text-gray-900 mb-6">Delete Story?</h1>
          
          <div class="mb-6">
            <p class="text-gray-700">Are you sure you want to delete the story:</p>
            <p class="text-lg font-semibold text-gray-900 mt-2">{{ story.title }}</p>
            <p class="text-sm text-gray-500 mt-2">This action cannot be undone. All media and attachments will also be deleted.</p>
          </div>

          <form method="post" class="flex justify-end space-x-3">
            {% csrf_token %}
            <a href="{% url 'story_detail' story.pk %}" class="bg-white py-2 px-4 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 hover:bg-gray-50">Cancel</a>
            <button type="submit" class="bg-red-600 border border-transparent rounded-md shadow-sm py-2 px-4 text-sm font-medium text-white hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500">Delete Story</button>
          </form>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
