{% extends 'base.html' %}
{% load static %}
{% load user_tags %}

{% block content %}
  <div class="max-w-7xl mx-auto py-6 sm:px-6 lg:px-8">
    <div class="px-4 py-6 sm:px-0">
      <div class="bg-white shadow overflow-hidden sm:rounded-md p-6">
        <h2 class="text-2xl font-semibold text-gray-900 mb-4">Available Seedpacks</h2>

        {% include '_components/messages.html' %}

        <ul class="space-y-4">
          {% for p in packs %}
            <li class="border border-gray-200 rounded p-4">
              <div class="flex justify-between items-center">
                <div>
                  <strong class="text-lg text-indigo-600">{{ p.name }}</strong>
                </div>
                <form method="post" action="{% url 'core:seedpack_run' p.name %}">
                  {% csrf_token %}
                  <button type="submit" onclick="return confirm('This will delete most existing data. Are you sure?');"
                          class="bg-red-600 hover:bg-red-700 text-white font-bold py-1 px-3 rounded text-sm">
                    Run
                  </button>
                </form>
              </div>
            </li>
          {% endfor %}
        </ul>
      </div>
    </div>
  </div>
{% endblock %}
